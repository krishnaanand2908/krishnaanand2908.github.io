<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishna's Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
            color: rgb(51, 51, 51);
        }

        header {
            background-color: rgb(77, 75, 75);
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 4px rgba(51, 51, 51, 0.1);
        }

        h2 {
            margin: 0;
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .gallery img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(51, 51, 51, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s;
            cursor: pointer;
            background: white;
            border: 2px solid #e0e0e0;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(51, 51, 51, 0.18);
            border-color: #bdbdbd;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: auto;
            background: rgb(255, 255, 255);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgb(255, 255, 255);
            display: block;
            margin: auto;
            background: white;
            border: 3px solid #e0e0e0;
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: black;
            /* Black × symbol */
            background: white;
            /* White button */
            border: none;
            border-radius: 50%;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 201;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }


        .modal-close:hover {
            background: #bdbdbd;
            color: rgb(51, 51, 51);
            /* Flip colors on hover */
            transform: scale(1.1);
        }


        footer {
            background-color: rgb(77, 75, 75);
            text-align: center;
            padding: 10px;
            border-top: 1px solid #e0e0e0;
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            z-index: 100;
            color: white;
        }

        footer a {
            background-color: rgb(51, 51, 51);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 1rem;
            font-family: inherit;
            margin-right: 15px;
            box-shadow: 0 2px 6px rgba(51, 51, 51, 0.08);
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s, transform 0.2s;
        }

        footer a:hover {
            background-color: #bdbdbd;
            color: rgb(51, 51, 51);
            transform: scale(1.04);
        }

        footer p {
            display: inline;
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <h2>Krishna's Image Gallery</h2>
    </header>

    <section class="gallery">
        <img src="Images/img1.jpg" alt="Image not found">
        <img src="Images/img2.jpg" alt="Image not found">
        <img src="Images/img3.jpg" alt="Image not found">
        <img src="Images/img4.jpg" alt="Image not found">
        <img src="Images/img5.jpg" alt="Image not found">
        <img src="Images/img6.jpg" alt="Image not found">
    </section>

    <!-- Modal for expanded image -->
    <div class="modal" id="imgModal">
        <button class="modal-close" id="closeModal">&times;</button>
        <img class="modal-content" id="modalImg" src="" alt="">
    </div>

    <footer>
        <a href="index.html">&#8592; Back</a>
        <p>&copy; 2025 Krishna's Profile</p>
    </footer>

    <script>
        const modal = document.getElementById('imgModal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.getElementById('closeModal');
        const galleryImages = document.querySelectorAll('.gallery img');

        galleryImages.forEach(img => {
            img.addEventListener('click', function () {
                modal.style.display = 'flex';
                modalImg.src = this.src;
                modalImg.alt = this.alt;
            });
        });

        closeModal.onclick = function () {
            modal.style.display = 'none';
            modalImg.src = '';
        };

        // Close modal when clicking outside the image
        modal.onclick = function (e) {
            if (e.target === modal) {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        };
    </script>
</body>

</html>
