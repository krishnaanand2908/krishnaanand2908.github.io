<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry Page</title>
<style>
/* ========== GLOBAL ========== */
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
  color: #e0e0ff;
  transition: background 0.4s, color 0.4s;
}

/* BLUE ↔ GOLD THEME */
body.theme-gold {
  background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
  color: #f5f5f5;
}

/* THEME TOGGLE BUTTON */
#theme-toggle {
  position: fixed;
  top: 15px;
  right: 20px;
  padding: 10px 18px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #4a00e0, #8e2de2);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  z-index: 1000;
  box-shadow: 0 0 12px rgba(142, 45, 226, 0.8), 0 0 25px rgba(74, 0, 224, 0.6);
  transition: all 0.3s ease;
}
body.theme-gold #theme-toggle {
  background: linear-gradient(135deg, #ffd700, #ff9a00);
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.8), 0 0 25px rgba(255, 154, 0, 0.6);
}
#theme-toggle:hover { transform: scale(1.08); }

/* BACK BUTTON */
#back-btn {
  position: fixed;
  top: 15px;
  left: 20px;
  padding: 10px 18px;
  border-radius: 30px;
  border: none;
  background: #444;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  z-index: 1000;
}
#back-btn:hover { background: #666; }

/* POEM CARDS */
.poem-card {
  max-width: 900px;
  margin: 80px auto 20px;
  padding: 20px;
  border-radius: 25px;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(120, 80, 255, 0.3);
  box-shadow: 0 4px 18px rgba(50, 30, 100, 0.6);
  cursor: pointer;
  transition: all 0.4s ease;
}
body.theme-gold .poem-card {
  border: 1px solid rgba(255, 215, 0, 0.3);
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.poem-card:hover {
  transform: scale(1.02);
}
.poem-title { font-size: 1.5em; font-weight: 600; margin: 0; }
.poem-author { font-size: 1em; margin: 5px 0 10px; opacity: 0.8; }

/* COLLAPSIBLE CONTENT */
.poem-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease;
  white-space: pre-line;
  margin-top: 10px;
}
.poem-card.expanded .poem-content { max-height: 10000px; }

/* RESPONSIVE */
@media (max-width: 768px) { .poem-card { margin: 100px 20px 20px; } }
</style>
</head>
<body>

<button id="theme-toggle">Toggle Theme</button>
<button id="back-btn" onclick="location.href='index.html'">Back</button>

<div id="poems-container"></div>

<script>
// THEME TOGGLE
const themeBtn = document.getElementById('theme-toggle');
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('theme-gold');
});

// FETCH POEMS FROM JSON
fetch('poems.json')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('poems-container');
    data.forEach(poem => {
      const card = document.createElement('div');
      card.className = 'poem-card';
      card.innerHTML = `
        <h2 class="poem-title">${poem.title}</h2>
        <p class="poem-author">${poem.author}</p>
        <div class="poem-content">${poem.content}</div>
      `;
      card.addEventListener('click', () => card.classList.toggle('expanded'));
      container.appendChild(card);
    });
  })
  .catch(err => console.error('Error loading poems:', err));
</script>

</body>
</html>
