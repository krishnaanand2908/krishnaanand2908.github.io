<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      transition: background 0.5s ease, color 0.5s ease;
    }

    /* Blue Theme */
    body.blue-theme {
      background: linear-gradient(135deg, #0d0d0d, #1a1a40);
      color: #e0e0ff;
    }

    /* Gold Theme */
    body.gold-theme {
      background: linear-gradient(135deg, #1a1a1a, #3a2a00);
      color: #fff9e6;
    }

    .container {
      text-align: center;
      padding: 30px;
      border-radius: 20px;
      max-width: 600px;
      width: 90%;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    body.blue-theme .container {
      background: rgba(20, 20, 50, 0.8);
      box-shadow: 0 0 25px rgba(80, 80, 255, 0.6);
    }

    body.gold-theme .container {
      background: rgba(60, 40, 0, 0.8);
      box-shadow: 0 0 25px rgba(255, 200, 50, 0.6);
    }

    h1 {
      font-size: 3rem;
      margin: 0 0 10px;
    }

    p {
      font-size: 1.2rem;
      margin: 0 0 20px;
    }

    a {
      text-decoration: none;
      transition: color 0.3s ease;
    }

    body.blue-theme a {
      color: #7a5cff;
    }

    body.blue-theme a:hover {
      color: #ffd700;
    }

    body.gold-theme a {
      color: #ffd700;
    }

    body.gold-theme a:hover {
      color: #7a5cff;
    }

    button {
      padding: 10px 20px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    body.blue-theme button {
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      color: white;
      box-shadow: 0 0 12px rgba(142, 45, 226, 0.8);
    }

    body.blue-theme button:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #ffd700, #ff9a00);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
    }

    body.gold-theme button {
      background: linear-gradient(135deg, #ffd700, #ff9a00);
      color: black;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
    }

    body.gold-theme button:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      color: white;
      box-shadow: 0 0 20px rgba(142, 45, 226, 0.9);
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 12px;
      font-weight: 500;
      border-radius: 20px 20px 0 0;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    body.blue-theme footer {
      background: linear-gradient(135deg, #0d0d2b, #3a2a70);
      box-shadow: 0 -4px 12px rgba(0, 0, 80, 0.6);
      color: #e0e0ff;
    }

    body.gold-theme footer {
      background: linear-gradient(135deg, #3a2a00, #ffd700);
      box-shadow: 0 -4px 12px rgba(80, 60, 0, 0.6);
      color: #fff9e6;
    }

    /* Toggle button */
    #theme-toggle {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1000;
      transition: all 0.3s ease, background 0.4s ease, box-shadow 0.4s ease;
    }

    body.blue-theme #theme-toggle {
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      color: white;
      box-shadow: 0 0 12px rgba(142, 45, 226, 0.8);
    }

    body.blue-theme #theme-toggle:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #ffd700, #ff9a00);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
    }

    body.gold-theme #theme-toggle {
      background: linear-gradient(135deg, #ffd700, #ff9a00);
      color: black;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
    }

    body.gold-theme #theme-toggle:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      color: white;
      box-shadow: 0 0 20px rgba(142, 45, 226, 0.9);
    }
  </style>
</head>

<body class="blue-theme">
  <button id="theme-toggle">Switch Theme</button>

  <div class="container">
    <h1>404 ERROR!</h1>
    <p>This page hasn't been created yet! If you think this is a bug, contact us at
      <a href="mailto:pythonkrishna290@gmail.com">pythonkrishna290@gmail.com</a>
    </p>
    <div>
      <button onclick="window.location.reload();">Reload</button>
    </div>
  </div>

  <footer>
    <a href="index.html">Home</a>
    <p>&copy; 2025 Krishna Anand</p>
  </footer>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('blue-theme');
      body.classList.toggle('gold-theme');
    });
  </script>
</body>

</html>
